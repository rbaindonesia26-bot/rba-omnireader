<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RBA OmniReader Pro™</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <!-- PDF-lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <style>
        /* Penambahan dukungan Font Arab: Amiri, Traditional Arabic, Arial */
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --reader-bg: #e2e8f0;
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Inter', 'Segoe UI', Tahoma, Arial, 'Traditional Arabic', 'Amiri', 'Scheherazade New', system-ui, sans-serif;
            overflow: hidden; 
            overscroll-behavior-y: none;
            touch-action: none;
        }
        
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .reader-wrapper {
            flex: 1;
            overflow: auto; 
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--reader-bg);
            position: relative;
            padding: 20px;
        }

        /* Sistem Pembungkus Kanvas Presisi Mutlak */
        #canvas-wrapper {
            position: relative;
            display: inline-block; 
            line-height: 0; 
            font-size: 0; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            background-color: white;
            transition: opacity 0.2s ease;
        }

        #pdf-canvas, #drawing-canvas, #active-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: top left;
        }
        
        #pdf-canvas { z-index: 1; position: relative; } 
        #drawing-canvas { z-index: 2; pointer-events: none; } 
        #active-canvas { z-index: 3; touch-action: auto; } 

        .btn-tool {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .active-tool {
            background-color: #dbeafe !important;
            color: #1d4ed8 !important;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            border-color: #bfdbfe !important;
        }

        #sidebar {
            transition: transform 0.3s ease-in-out;
            transform: translateX(-100%);
            z-index: 50;
        }
        #sidebar.open {
            transform: translateX(0);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-200">

    <div id="toast-container" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Halaman Awal -->
    <div id="welcome-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 overflow-y-auto">
        <div class="max-w-md w-full flex flex-col items-center animate-fade-in-up">
            
            <!-- Logo area Asli (Dari Link IBB) -->
            <a href="https://ibb.co.com/0VXNWm8v" target="_blank" class="flex justify-center transition-transform hover:scale-105 hover:drop-shadow-xl z-10 mb-4 rounded-2xl drop-shadow-md overflow-hidden bg-white">
                <img src="https://i.ibb.co.com/tPhfNQkF/Chat-GPT-Image-Jul-31-2026-05-59-44-PM.png" alt="Logo RBA OmniReader" border="0" class="h-36 w-auto object-contain">
            </a>
            
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight text-center mb-2">RBA OmniReader <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">Pro™</span></h1>
            <p class="text-slate-500 text-center mb-10 text-sm font-medium">Buka PDF atau Gambar. Coret, Stabilo, Simpan dengan Presisi Tingkat Tinggi.</p>
            
            <!-- Upload Buttons -->
            <div class="w-full space-y-4">
                <label class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-4 rounded-xl font-bold transition-all cursor-pointer flex items-center justify-center gap-3 shadow-lg hover:shadow-2xl transform hover:-translate-y-1 w-full">
                    <i class="fas fa-file-pdf text-xl text-red-400"></i> 
                    <span>Buka File PDF / Dokumen</span>
                    <input type="file" accept="application/pdf" class="hidden" id="welcome-pdf-upload">
                </label>
                
                <label class="bg-white border-2 border-slate-200 hover:border-blue-400 text-slate-700 hover:text-blue-600 px-6 py-4 rounded-xl font-bold transition-all cursor-pointer flex items-center justify-center gap-3 shadow-sm hover:shadow-md w-full">
                    <i class="fas fa-image text-xl text-blue-500"></i> 
                    <span>Buka Gambar (JPG/PNG)</span>
                    <input type="file" accept="image/*" class="hidden" id="welcome-image-upload">
                </label>

                <!-- Tombol Kamera (Diperbaiki agar langsung membuka Kamera HP) -->
                <label class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-6 py-4 rounded-xl font-bold transition-all cursor-pointer flex items-center justify-center gap-3 shadow-lg hover:shadow-2xl transform hover:-translate-y-1 w-full">
                    <i class="fas fa-camera text-xl"></i> 
                    <span>Ambil Foto Langsung</span>
                    <input type="file" accept="image/*" capture="camera" class="hidden" id="welcome-camera-upload">
                </label>
            </div>
            
            <!-- License Box (Tampilan Dirapatkan) -->
            <div class="mt-8 text-center text-xs opacity-70 p-4 bg-slate-100 rounded-lg border border-slate-200 w-full max-w-sm flex flex-col items-center justify-center gap-2">
                <p class="font-bold text-slate-800"><i class="fas fa-shield-alt text-amber-500"></i> HAK CIPTA & PATEN DILINDUNGI</p>
                <button onclick="downloadLicense()" class="bg-amber-100 text-amber-800 px-3 py-1.5 rounded font-bold hover:bg-amber-200 transition text-[10px] uppercase tracking-wide border border-amber-200 w-full mt-1">
                    <i class="fas fa-download mr-1"></i> Unduh Deklarasi Lisensi
                </button>
            </div>
        </div>
    </div>

    <!-- Main App UI -->
    <div id="app-container" class="hidden">
        
        <!-- Header / Navbar -->
        <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shrink-0 shadow-sm z-40 relative">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="w-10 h-10 rounded-full hover:bg-slate-100 text-slate-600 flex items-center justify-center transition" title="Daftar Isi">
                    <i class="fas fa-bars text-lg"></i>
                </button>
                <div class="font-bold text-slate-800 hidden sm:block truncate max-w-[200px]" id="doc-title">RBA OmniReader</div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Ikon Pencarian -->
                <button onclick="searchNotAvailable()" class="w-10 h-10 rounded-full hover:bg-slate-100 text-slate-600 flex items-center justify-center transition mr-2" title="Cari Teks">
                    <i class="fas fa-search text-lg"></i>
                </button>
                
                <button onclick="triggerNewUpload()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition hidden sm:block">
                    <i class="fas fa-folder-open mr-1.5"></i> Buka Baru
                </button>
                <button onclick="exportPdfHighRes()" class="px-4 py-2 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow transition flex items-center gap-2">
                    <i class="fas fa-save"></i> <span class="hidden sm:inline">Preview & Simpan</span>
                </button>
            </div>
        </header>

        <!-- Sidebar Daftar Isi -->
        <div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white border-r border-slate-200 shadow-2xl flex flex-col pt-16">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="font-bold text-slate-700"><i class="fas fa-list-ul mr-2 text-blue-500"></i> Daftar Isi</h2>
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-slate-700"><i class="fas fa-times"></i></button>
            </div>
            <div id="toc-list" class="flex-1 overflow-y-auto p-4 bg-white text-sm">
                <!-- TOC items injected here -->
            </div>
        </div>

        <!-- Annotation Toolbar (LENGKAP: Undo, Redo, Teks, Tipe-X dll) -->
        <div class="bg-white border-b border-slate-200 px-2 py-2 flex items-center justify-start gap-1 sm:gap-2 shrink-0 overflow-x-auto shadow-sm z-30">
            <!-- Pagination -->
            <div class="flex items-center bg-slate-100 rounded-lg p-1 mr-2 border border-slate-200 shrink-0">
                <button onclick="prevPage()" class="w-8 h-8 rounded text-slate-600 hover:bg-white hover:shadow-sm"><i class="fas fa-chevron-left"></i></button>
                <span class="text-sm font-medium px-2 text-slate-700 text-center whitespace-nowrap"><span id="page-num">1</span> / <span id="page-count">1</span></span>
                <button onclick="nextPage()" class="w-8 h-8 rounded text-slate-600 hover:bg-white hover:shadow-sm"><i class="fas fa-chevron-right"></i></button>
            </div>

            <div class="h-6 w-px bg-slate-300 mx-1 shrink-0"></div>
            
            <!-- Tangan / Pan -->
            <button id="tool-pan" onclick="setTool('pan')" class="btn-tool active-tool shrink-0 w-10 h-10 rounded-lg text-slate-600 border border-transparent flex flex-col items-center justify-center gap-0.5" title="Geser Halaman (Baca)">
                <i class="fas fa-hand-paper text-lg"></i>
            </button>
            
            <!-- Pena & Warna -->
            <div class="relative group flex items-center shrink-0 bg-slate-50 rounded-lg p-1 border border-transparent hover:border-slate-200">
                <button id="tool-pen" onclick="setTool('pen')" class="btn-tool w-8 h-8 rounded text-slate-600 flex items-center justify-center" title="Pena">
                    <i class="fas fa-pen text-lg"></i>
                </button>
                <input type="color" id="pen-color" value="#000000" class="w-6 h-6 ml-1 p-0 border-0 rounded cursor-pointer shrink-0 shadow-sm" onchange="setTool('pen')" title="Pilih Warna Pena">
            </div>

            <!-- Stabilo & Warna -->
            <div class="relative group flex items-center shrink-0 bg-slate-50 rounded-lg p-1 border border-transparent hover:border-slate-200">
                <button id="tool-highlight" onclick="setTool('highlight')" class="btn-tool w-8 h-8 rounded text-slate-600 flex items-center justify-center" title="Stabilo">
                    <i class="fas fa-highlighter text-lg"></i>
                </button>
                <input type="color" id="hl-color" value="#fef08a" class="w-6 h-6 ml-1 p-0 border-0 rounded cursor-pointer shrink-0 shadow-sm" onchange="setTool('highlight')" title="Pilih Warna Stabilo">
            </div>
            
            <!-- Teks -->
            <button id="tool-text" onclick="setTool('text')" class="btn-tool shrink-0 w-10 h-10 rounded-lg text-slate-600 border border-transparent flex items-center justify-center" title="Tambah Teks">
                <i class="fas fa-font text-lg"></i>
            </button>

            <!-- Tipe-X -->
            <button id="tool-tipex" onclick="setTool('tipex')" class="btn-tool shrink-0 w-10 h-10 rounded-lg text-slate-600 border border-transparent flex items-center justify-center" title="Tipe-X (Tinta Putih)">
                <i class="fas fa-paint-roller text-lg"></i>
            </button>

            <!-- Penghapus -->
            <button id="tool-eraser" onclick="setTool('eraser')" class="btn-tool shrink-0 w-10 h-10 rounded-lg text-slate-600 border border-transparent flex items-center justify-center" title="Penghapus Coretan">
                <i class="fas fa-eraser text-lg"></i>
            </button>
            
            <div class="h-6 w-px bg-slate-300 mx-1 shrink-0"></div>
            
            <!-- Undo / Redo -->
            <button onclick="undo()" class="shrink-0 w-10 h-10 rounded-lg text-slate-600 hover:bg-slate-100 flex items-center justify-center transition" title="Undo (Batal)">
                <i class="fas fa-undo text-lg"></i>
            </button>
            <button onclick="redo()" class="shrink-0 w-10 h-10 rounded-lg text-slate-600 hover:bg-slate-100 flex items-center justify-center transition mr-1" title="Redo (Ulangi)">
                <i class="fas fa-redo text-lg"></i>
            </button>

            <!-- Tong Sampah -->
            <button onclick="clearPage()" class="shrink-0 w-10 h-10 rounded-lg text-red-500 hover:bg-red-50 flex items-center justify-center transition" title="Hapus Semua di Halaman Ini">
                <i class="fas fa-trash-alt text-lg"></i>
            </button>
        </div>

        <!-- Canvas / Reader Area -->
        <div class="reader-wrapper" id="reader-wrapper">
            <div id="canvas-wrapper">
                <canvas id="pdf-canvas"></canvas>
                <canvas id="drawing-canvas"></canvas>
                <canvas id="active-canvas"></canvas>
            </div>
        </div>
        
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center">
            <div class="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
            <p id="loading-text" class="text-slate-800 font-bold text-lg animate-pulse">Memproses...</p>
        </div>
    </div>

    <script>
        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-6 py-3 rounded-xl shadow-2xl text-sm font-bold text-white transition-all duration-300 transform translate-y-10 opacity-0 ${isError ? 'bg-red-600' : 'bg-slate-800'}`;
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-info-circle'} mr-2"></i> ${message}`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function searchNotAvailable() {
            showToast("Sistem Pencarian Teks dinonaktifkan sementara pada Mode Scanner Presisi untuk menjaga kestabilan anti-geser.", true);
        }

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let originalPdfBytes = null;
        
        const pdfCanvas = document.getElementById('pdf-canvas');
        const pdfCtx = pdfCanvas.getContext('2d', { alpha: false });
        
        const drawCanvas = document.getElementById('drawing-canvas');
        const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });
        
        const activeCanvas = document.getElementById('active-canvas');
        const activeCtx = activeCanvas.getContext('2d');

        let pageDrawings = {}; 
        let drawingHistory = {}; 
        let historyStep = {};
        
        let isDrawing = false;
        let currentTool = 'pan'; 
        let lastX = 0, lastY = 0;
        
        const fileInputs = ['welcome-pdf-upload', 'welcome-image-upload', 'welcome-camera-upload'];
        fileInputs.forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                el.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) handleFile(file);
                });
            }
        });

        function triggerNewUpload() {
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
            pdfDoc = null; pageDrawings = {}; drawingHistory = {}; historyStep = {}; pageNum = 1;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function showLoading(text = 'Memproses...') {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-overlay').classList.remove('hidden');
            document.getElementById('loading-overlay').classList.add('flex');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
            document.getElementById('loading-overlay').classList.remove('flex');
        }

        async function handleFile(file) {
            showLoading('Membaca file...');
            try {
                if (file.type.startsWith('image/')) {
                    await handleImageAsPdf(file);
                } else if (file.type === 'application/pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    originalPdfBytes = new Uint8Array(arrayBuffer);
                    await loadPdf(originalPdfBytes);
                } else {
                    throw new Error("Format file tidak didukung.");
                }
                
                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('doc-title').innerText = file.name;
                
            } catch (error) {
                console.error(error);
                showToast(error.message || 'Gagal membuka file.', true);
            } finally {
                hideLoading();
                fileInputs.forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = ''; });
            }
        }

        async function handleImageAsPdf(imageFile) {
            const { PDFDocument } = PDFLib;
            const pdf = await PDFDocument.create();
            const imageBytes = await imageFile.arrayBuffer();
            let image;
            
            if (imageFile.type === 'image/jpeg') {
                image = await pdf.embedJpg(imageBytes);
            } else if (imageFile.type === 'image/png') {
                image = await pdf.embedPng(imageBytes);
            } else {
                throw new Error("Hanya JPG dan PNG yang didukung saat ini.");
            }

            const page = pdf.addPage([image.width, image.height]);
            page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
            
            originalPdfBytes = await pdf.save();
            await loadPdf(originalPdfBytes);
        }

        async function loadPdf(data) {
            const loadingTask = pdfjsLib.getDocument({ data: data });
            pdfDoc = await loadingTask.promise;
            document.getElementById('page-count').textContent = pdfDoc.numPages;
            
            const outline = await pdfDoc.getOutline();
            renderTOC(outline);

            pageNum = 1;
            renderPage(pageNum);
        }

        function renderTOC(outline) {
            const tocContainer = document.getElementById('toc-list');
            tocContainer.innerHTML = '';
            
            if (!outline || outline.length === 0) {
                tocContainer.innerHTML = '<div class="p-6 text-center text-slate-500 flex flex-col items-center"><i class="fas fa-info-circle text-3xl mb-3 text-slate-300"></i><p>Tidak ada Daftar Isi (Outline) tertanam pada dokumen ini dari pembuatnya.</p></div>';
                return;
            }
            
            const createList = (items, level = 0) => {
                const ul = document.createElement('ul');
                ul.className = level === 0 ? 'space-y-1' : 'pl-4 mt-1 border-l border-slate-200';
                
                items.forEach(item => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.textContent = item.title;
                    a.dir = "auto"; 
                    a.className = `block py-1.5 px-2 rounded hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition ${level === 0 ? 'font-semibold text-slate-800' : 'text-slate-600 text-sm'}`;
                    
                    a.onclick = async (e) => {
                        e.preventDefault();
                        toggleSidebar(); 
                        let dest = item.dest;
                        if (typeof dest === 'string') { dest = await pdfDoc.getDestination(dest); }
                        if (dest && dest.length > 0) {
                            const pageRef = dest[0];
                            try {
                                const targetPage = await pdfDoc.getPageIndex(pageRef) + 1;
                                queueRenderPage(targetPage);
                            } catch(e) { console.warn("Cannot find page", e); }
                        }
                    };
                    
                    li.appendChild(a);
                    if (item.items && item.items.length > 0) li.appendChild(createList(item.items, level + 1));
                    ul.appendChild(li);
                });
                return ul;
            };
            
            tocContainer.appendChild(createList(outline));
        }

        async function renderPage(num) {
            pageRendering = true;
            const page = await pdfDoc.getPage(num);

            const container = document.getElementById('reader-wrapper');
            const containerWidth = container.clientWidth - 40; 
            const containerHeight = container.clientHeight - 40;

            const unscaledViewport = page.getViewport({ scale: 1.0 });
            const scaleX = containerWidth / unscaledViewport.width;
            const scaleY = containerHeight / unscaledViewport.height;
            const fitScale = Math.min(scaleX, scaleY) * 0.98; 

            const pixelRatio = window.devicePixelRatio || 1;
            const internalScale = fitScale * pixelRatio * 1.5; 
            const viewport = page.getViewport({ scale: internalScale });

            pdfCanvas.width = viewport.width;
            pdfCanvas.height = viewport.height;
            
            const cssWidth = `${viewport.width / pixelRatio / 1.5}px`;
            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.width = cssWidth;

            const renderContext = { canvasContext: pdfCtx, viewport: viewport };
            await page.render(renderContext).promise;

            drawCanvas.width = pdfCanvas.width;
            drawCanvas.height = pdfCanvas.height;
            activeCanvas.width = pdfCanvas.width;
            activeCanvas.height = pdfCanvas.height;

            if (pageDrawings[num]) {
                const img = new Image();
                img.onload = () => drawCtx.drawImage(img, 0, 0);
                img.src = pageDrawings[num];
            } else {
                drawCtx.clearRect(0,0, drawCanvas.width, drawCanvas.height);
            }

            pageRendering = false;
            document.getElementById('page-num').textContent = num;

            if (pageNumPending !== null) {
                renderPage(pageNumPending);
                pageNumPending = null;
            }
        }

        function queueRenderPage(num) {
            if (pageRendering) { pageNumPending = num; } 
            else { pageNum = num; renderPage(num); }
        }

        function prevPage() { if (pageNum <= 1) return; queueRenderPage(pageNum - 1); }
        function nextPage() { if (pageNum >= pdfDoc.numPages) return; queueRenderPage(pageNum + 1); }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.btn-tool').forEach(btn => btn.classList.remove('active-tool'));
            document.getElementById(`tool-${tool}`).classList.add('active-tool');
            
            activeCanvas.style.touchAction = tool === 'pan' ? 'auto' : 'none';
        }

        function clearPage() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            saveCurrentDrawing();
        }

        function saveCurrentDrawing() {
            const emptyData = document.createElement('canvas');
            emptyData.width = drawCanvas.width; emptyData.height = drawCanvas.height;
            const currentData = drawCanvas.toDataURL();

            if (currentData !== emptyData.toDataURL()) {
                pageDrawings[pageNum] = drawCanvas.toDataURL('image/png');
            } else {
                delete pageDrawings[pageNum];
            }

            // Simpan ke History untuk Undo/Redo
            if(!drawingHistory[pageNum]) drawingHistory[pageNum] = [];
            if(historyStep[pageNum] == null) historyStep[pageNum] = -1;
            
            if(historyStep[pageNum] < drawingHistory[pageNum].length - 1) {
                drawingHistory[pageNum] = drawingHistory[pageNum].slice(0, historyStep[pageNum] + 1);
            }
            drawingHistory[pageNum].push(currentData);
            historyStep[pageNum]++;
        }

        function undo() {
            if(drawingHistory[pageNum] && historyStep[pageNum] > 0) {
                historyStep[pageNum]--;
                restoreFromHistory();
            } else if (historyStep[pageNum] === 0) {
                historyStep[pageNum]--;
                drawCtx.clearRect(0,0, drawCanvas.width, drawCanvas.height);
                delete pageDrawings[pageNum];
            }
        }

        function redo() {
            if(drawingHistory[pageNum] && historyStep[pageNum] < drawingHistory[pageNum].length - 1) {
                historyStep[pageNum]++;
                restoreFromHistory();
            }
        }

        function restoreFromHistory() {
            const step = historyStep[pageNum];
            if(step >= 0 && drawingHistory[pageNum][step]) {
                const img = new Image();
                img.onload = () => {
                    drawCtx.clearRect(0,0, drawCanvas.width, drawCanvas.height);
                    drawCtx.drawImage(img, 0, 0);
                    pageDrawings[pageNum] = drawingHistory[pageNum][step];
                };
                img.src = drawingHistory[pageNum][step];
            }
        }

        function getMousePos(e) {
            const rect = activeCanvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            const scaleX = activeCanvas.width / rect.width;
            const scaleY = activeCanvas.height / rect.height;
            
            return { 
                x: (clientX - rect.left) * scaleX, 
                y: (clientY - rect.top) * scaleY 
            };
        }

        // ==========================================
        // MESIN CORE KUAS DIGITAL (DIPERBAIKI)
        // ==========================================
        function startDrawing(e) {
            if (currentTool === 'pan') return;
            const pos = getMousePos(e);

            if (currentTool === 'text') {
                const txt = prompt("Ketik teks yang ingin ditambahkan di area ini:");
                if (txt) {
                    drawCtx.font = "bold 32px Arial";
                    drawCtx.fillStyle = document.getElementById('pen-color').value;
                    drawCtx.fillText(txt, pos.x, pos.y + 10);
                    saveCurrentDrawing();
                }
                return;
            }

            isDrawing = true;
            lastX = pos.x; lastY = pos.y;

            if (currentTool !== 'eraser') {
                activeCtx.beginPath();
                activeCtx.moveTo(pos.x, pos.y);
            }
        }

        function drawLine(e) {
            if (!isDrawing || currentTool === 'pan' || currentTool === 'text') return;
            e.preventDefault(); 

            const pos = getMousePos(e);
            
            if (currentTool === 'eraser') {
                drawCtx.globalCompositeOperation = 'destination-out';
                drawCtx.beginPath();
                drawCtx.moveTo(lastX, lastY);
                drawCtx.lineTo(pos.x, pos.y);
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';
                drawCtx.lineWidth = 30; 
                drawCtx.stroke();
                drawCtx.globalCompositeOperation = 'source-over';
                lastX = pos.x; lastY = pos.y;
            } else {
                // KUNCI SOLUSI STABILO: 
                // Bersihkan kanvas sementara setiap kali bergerak agar warna tidak menumpuk jadi pekat
                activeCtx.clearRect(0, 0, activeCanvas.width, activeCanvas.height);
                
                activeCtx.lineTo(pos.x, pos.y);
                activeCtx.lineCap = 'round';
                activeCtx.lineJoin = 'round';
                
                if (currentTool === 'highlight') {
                    activeCtx.strokeStyle = document.getElementById('hl-color').value;
                    activeCtx.lineWidth = 25;
                    activeCtx.globalAlpha = 0.4; // Tembus Pandang Konstan 40%
                } else if (currentTool === 'pen') {
                    activeCtx.strokeStyle = document.getElementById('pen-color').value;
                    activeCtx.lineWidth = 4;
                    activeCtx.globalAlpha = 1.0; // Pekat 100%
                } else if (currentTool === 'tipex') {
                    activeCtx.strokeStyle = '#ffffff'; 
                    activeCtx.lineWidth = 25; 
                    activeCtx.globalAlpha = 1.0; 
                }
                activeCtx.stroke();
            }
        }

        function endDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            
            if (currentTool !== 'eraser' && currentTool !== 'pan' && currentTool !== 'text') {
                // Untuk memastikan tumpukan goresan stabilo baru di atas stabilo lama memberi efek spidol (Multiply)
                drawCtx.globalCompositeOperation = currentTool === 'highlight' ? 'multiply' : 'source-over';
                drawCtx.globalAlpha = 1.0; 
                
                // Pindahkan hasil akhir goresan tembus pandang ke kanvas utama
                drawCtx.drawImage(activeCanvas, 0, 0);
                
                // Bersihkan kanvas sementara
                activeCtx.clearRect(0, 0, activeCanvas.width, activeCanvas.height);
                drawCtx.globalCompositeOperation = 'source-over'; 
            }
            saveCurrentDrawing();
        }

        activeCanvas.addEventListener('mousedown', startDrawing);
        activeCanvas.addEventListener('mousemove', drawLine);
        activeCanvas.addEventListener('mouseup', endDrawing);
        activeCanvas.addEventListener('mouseout', endDrawing);

        activeCanvas.addEventListener('touchstart', startDrawing, {passive: false});
        activeCanvas.addEventListener('touchmove', drawLine, {passive: false});
        activeCanvas.addEventListener('touchend', endDrawing);

        // --- SISTEM SCANNER RESOLUSI TINGGI (PREVIEW & SIMPAN) ---
        // INI ADALAH CORE ENGINE ANTI-GESER (DIKUNCI)
        async function exportPdfHighRes() {
            showLoading('Menyatukan tinta & kertas (Anti-Geser)...');
            
            try {
                const { PDFDocument } = PDFLib;
                const newPdf = await PDFDocument.create();

                // Scanner 3.0x Scale Matrix (Sangat Presisi)
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const exportScale = 3.0; 
                    const exportViewport = page.getViewport({ scale: exportScale });
                    
                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d', { alpha: false });
                    tempCanvas.width = exportViewport.width;
                    tempCanvas.height = exportViewport.height;

                    tempCtx.fillStyle = '#ffffff';
                    tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

                    // 1. Sablon Dasar PDF
                    await page.render({ canvasContext: tempCtx, viewport: exportViewport }).promise;

                    // 2. Tempel Tinta Coretan (Termasuk Stabilo Tembus Pandang)
                    if (pageDrawings[i]) {
                        const img = new Image();
                        await new Promise(res => { img.onload = res; img.src = pageDrawings[i]; });
                        tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
                    }

                    // 3. Konversi gambar ke PDF baru
                    const flattenedImageBytes = tempCanvas.toDataURL('image/jpeg', 0.95);
                    const embeddedImage = await newPdf.embedJpg(flattenedImageBytes);

                    const pdfPage = newPdf.addPage([exportViewport.width, exportViewport.height]);
                    pdfPage.drawImage(embeddedImage, {
                        x: 0, y: 0, width: exportViewport.width, height: exportViewport.height
                    });
                }

                const pdfBytes = await newPdf.save();
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const url = URL.createObjectURL(blob);
                
                // Eksekusi Unduh Otomatis
                const link = document.createElement('a');
                link.href = url;
                link.download = `[RBA]_${document.getElementById('doc-title').innerText.replace('.pdf','')}.pdf`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                showToast("Berhasil Disimpan secara Presisi!");
            } catch (error) {
                console.error("Export Error:", error);
                showToast("Gagal menyimpan dokumen.", true);
            } finally {
                hideLoading();
            }
        }
