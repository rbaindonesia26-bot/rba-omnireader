<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBA OmniReader Pro™ V11</title>
    
    <!-- KODE PWA (PENGHUBUNG INSTALASI) -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/20t7Rfxq/ENSIKLOPEDIA-23.png">
    
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Khusus Mode Gelap (Eye-Care) & Font Arab */
        @import url('https://fonts.googleapis.com/css2?family=Amiri&display=swap');
        
        :root {
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --panel-bg: #ffffff;
            --border-color: #e5e7eb;
            --canvas-filter: none;
        }

        .dark-mode {
            --bg-color: #111827;
            --text-color: #f3f4f6;
            --panel-bg: #1f2937;
            --border-color: #374151;
            /* Memberikan efek sepia/redup pada kertas PDF agar tidak silau */
            --canvas-filter: brightness(0.85) sepia(0.1) contrast(0.9);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .arabic-text {
            font-family: 'Amiri', 'Traditional Arabic', Tahoma, serif;
            direction: auto;
        }

        #pdf-render {
            filter: var(--canvas-filter);
            transition: filter 0.3s;
        }
        
        .panel-container {
            background-color: var(--panel-bg);
            border-color: var(--border-color);
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- HEADER / NAVBAR -->
    <header class="panel-container border-b shadow-sm p-3 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3 sm:space-x-4">
            <!-- LOGO BARU YANG RESPONSIF DENGAN LINK AKTIF -->
            <a href="https://ibb.co.com/6cPRGfzY" target="_blank" rel="noopener noreferrer">
                <img src="https://i.ibb.co.com/20t7Rfxq/ENSIKLOPEDIA-23.png" alt="ENSIKLOPEDIA (23)" border="0" class="max-h-12 sm:max-h-16 w-auto object-contain transition-all duration-300 hover:scale-105">
            </a>
            
            <!-- JUDUL WARNA WARNI PRESISI SESUAI GAMBAR IMAGE_E9EE1A.PNG -->
            <div>
                <h1 class="text-xl sm:text-2xl md:text-4xl font-extrabold" style="font-family: 'Segoe UI', Arial, sans-serif; text-shadow: 0px 1px 1px rgba(0,0,0,0.05);">
                    <span style="color: #3260e8;">RBA</span> 
                    <span style="color: #6c46e3;">OmniReader</span> 
                    <span style="color: #b96582;">Pro™</span> 
                    <span style="color: #f59a1f;">V11</span>
                </h1>
                <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 hidden sm:block mt-1 font-medium">Master PDF Generator & Universal Reader</p>
            </div>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-4">
            <!-- TOMBOL MODE MALAM (DARK MODE) -->
            <button id="btn-dark-mode" class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors" title="Mode Malam / Eye-Care">
                <i class="fas fa-moon text-lg sm:text-xl"></i>
            </button>
            
            <button class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors" title="Pencarian (Info)">
                <i class="fas fa-search text-lg"></i>
            </button>
            
            <button onclick="downloadLicense()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-sm sm:text-base font-semibold shadow-md transition-all">
                <i class="fas fa-download mr-1 sm:mr-2"></i> Lisensi Wakaf
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- SIDEBAR (DAFTAR ISI & INDIKATOR CORETAN) -->
        <aside class="panel-container w-64 border-r flex flex-col h-full hidden md:flex z-10 transition-colors">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                <h2 class="font-bold text-lg"><i class="fas fa-list mr-2"></i> Daftar Isi</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2 arabic-text" id="toc-container">
                <p class="text-sm text-gray-500 italic">Memuat struktur dokumen...</p>
            </div>
            
            <!-- PANEL INDIKATOR HALAMAN TERANOTASI -->
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
                <h3 class="font-semibold text-sm mb-2"><i class="fas fa-edit mr-1 text-amber-500"></i> Halaman Bercoretan:</h3>
                <div id="annotated-pages-list" class="flex flex-wrap gap-1">
                    <span class="text-xs text-gray-400 italic">Belum ada coretan</span>
                </div>
            </div>
        </aside>

        <!-- KANVAS PDF UTAMA -->
        <div class="flex-1 overflow-auto bg-gray-200 dark:bg-gray-900 relative flex justify-center p-2 sm:p-4" id="canvas-wrapper">
            <!-- Canvas dibungkus agar presisi mutlak -->
            <canvas id="pdf-render" class="shadow-xl bg-white max-w-full h-auto"></canvas>
        </div>

        <!-- FLOATING TOOLBAR (ALAT CORET, STABILO, TIPE-X, TEKS, PALET WARNA) -->
        <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 panel-container shadow-2xl rounded-full px-4 sm:px-6 py-2 sm:py-3 flex space-x-2 sm:space-x-4 items-center border">
            <button id="tool-pen" class="tool-btn text-blue-600 hover:text-blue-800 p-2 text-lg sm:text-xl rounded-full" title="Pena">
                <i class="fas fa-pen"></i>
            </button>
            <button id="tool-highlighter" class="tool-btn text-yellow-400 hover:text-yellow-600 p-2 text-lg sm:text-xl rounded-full" title="Stabilo">
                <i class="fas fa-highlighter"></i>
            </button>
            <button id="tool-whiteout" class="tool-btn text-gray-400 hover:text-gray-600 p-2 text-lg sm:text-xl rounded-full" title="Tipe-X (Hapus Permanen)">
                <i class="fas fa-paint-brush"></i>
            </button>
            <button id="tool-text" class="tool-btn text-gray-600 dark:text-gray-300 hover:text-gray-800 p-2 text-lg sm:text-xl rounded-full" title="Sisipkan Teks">
                <i class="fas fa-font"></i>
            </button>
            
            <div class="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1 sm:mx-2"></div>
            
            <!-- TOMBOL PALET JUTAAN WARNA -->
            <label for="color-picker" class="cursor-pointer p-2 text-lg sm:text-xl hover:scale-110 transition-transform" title="Pilih Warna">
                <i class="fas fa-palette" style="background: -webkit-linear-gradient(45deg, red, blue, green, yellow); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
            </label>
            <input type="color" id="color-picker" class="hidden" value="#000000">

            <div class="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1 sm:mx-2"></div>
            
            <!-- UNDO / REDO -->
            <button id="tool-undo" class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 p-2 text-lg sm:text-xl rounded-full" title="Undo">
                <i class="fas fa-undo"></i>
            </button>
            <button id="tool-redo" class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 p-2 text-lg sm:text-xl rounded-full" title="Redo">
                <i class="fas fa-redo"></i>
            </button>
        </div>
    </main>

    <!-- SCRIPT MESIN PRESISI (DIKUNCI) -->
    <script>
        // SCRIPT REGISTRASI PWA / SERVICE WORKER
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('PWA Service Worker berhasil didaftarkan!', registration);
                    })
                    .catch(err => {
                        console.log('PWA Service Worker gagal didaftarkan:', err);
                    });
            });
        }

        // FUNGSI UNDUH LISENSI WAKAF
        function downloadLicense() {
            const licenseText = `=============================================================
         DEKLARASI LISENSI DISTRIBUSI TERBUKA & WAKAF
               RBA OmniReader Pro™ - Master PDF
=============================================================

Dengan ini dideklarasikan secara resmi bahwa perangkat lunak:
Nama Alat : RBA (Rumah Bahasa Arab) OmniReader Pro™
Fungsi    : Master PDF Generator & Universal Reader
Pemilik   : M. Nur Muslim (Hak Cipta Dilindungi)

1. STATUS KEPEMILIKAN & WAKAF
Perangkat lunak ini merupakan hak cipta dan karya intelektual 
dari M. Nur Muslim. Mulai tanggal peluncurannya, alat ini resmi 
DIWAKAFKAN untuk kemaslahatan umat, pendidikan, dan 
pengembangan ilmu pengetahuan.

2. HAK DISTRIBUSI TERBUKA (OPEN DISTRIBUTION)
Kami memberikan hak dan izin penuh kepada siapa pun (individu, 
komunitas, maupun lembaga/institusi) untuk:
  a. Menggunakan aplikasi ini tanpa batas waktu.
  b. Menyebarluaskan, menyalin, dan membagikan aplikasi ini 
     secara BEBAS dan GRATIS kepada siapa saja.

3. LARANGAN KERAS (RESTRICTIONS)
Demi menjaga niat tulus dari pewakafan ini, SANGAT DILARANG 
KERAS untuk:
  a. Memperjualbelikan aplikasi ini dalam bentuk dan dalih apapun.
  b. Menghapus nama pengembang (M. Nur Muslim) atau mengklaim
     hak cipta atas logo/sistem milik RBA OmniReader Pro™.

Semoga alat ini membawa keberkahan, manfaat, dan kemudahan.

Dideklarasikan pada: Agustus 2026

Hormat kami,
M. Nur Muslim
RBA - Rumah Bahasa Arab`;

            const blob = new Blob([licenseText], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Deklarasi_Lisensi_Wakaf_RBA.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        // FUNGSI MODE MALAM (DARK MODE)
        const btnDarkMode = document.getElementById('btn-dark-mode');
        const iconDarkMode = btnDarkMode.querySelector('i');
        
        btnDarkMode.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if(document.body.classList.contains('dark-mode')) {
                iconDarkMode.classList.remove('fa-moon');
                iconDarkMode.classList.add('fa-sun');
                iconDarkMode.classList.add('text-yellow-400');
            } else {
                iconDarkMode.classList.remove('fa-sun');
                iconDarkMode.classList.add('fa-moon');
                iconDarkMode.classList.remove('text-yellow-400');
            }
        });

        console.log("RBA OmniReader Pro™ Engine V11 - Initialization Complete. System Locked for Stability.");
    </script>
</body>
</html>
